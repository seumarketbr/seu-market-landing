name: Gerar Post do Blog

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 BRT — manhã (operacional)
    - cron: '0 17 * * *'   # 14:00 BRT — tarde (síndico)
    - cron: '0 23 * * *'   # 20:00 BRT — noite (tecnologia)
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo da geração manual'
        required: false
        default: 'Teste manual'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-post.yml'

jobs:
  gerar-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar post com IA
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python .github/scripts/generate_post.py

      - name: Atualizar manifest
        run: python .github/scripts/generate_manifest.py

      - name: Commit e push
        run: |
          git config user.name "Seu Market Bot"
          git config user.email "blog-bot@seumarket.com.br"
          git add public/blog-posts/
          git diff --cached --quiet || git commit -m "blog: novo post automático $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Disparar deploy no Cloudflare
        if: success()
        run: |
          echo "Disparando deploy no Cloudflare Workers..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}")
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            echo "✅ Deploy disparado com sucesso! Status: $HTTP_STATUS"
          else
            echo "⚠️ Aviso: resposta inesperada do Cloudflare. Status: $HTTP_STATUS"
            echo "Verifique se o secret CLOUDFLARE_DEPLOY_HOOK está configurado corretamente."
          fi

---
# Workflow auxiliar de keepalive (evita pausa automática do GitHub)
# O GitHub pausa workflows cron após ~60 dias sem atividade no repositório.
# Este workflow faz um commit semanal para manter o repositório ativo.
